version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adaptive_learning_postgres
    restart: always
    environment:
      POSTGRES_USER: learning_user
      POSTGRES_PASSWORD: learning_secure_password
      POSTGRES_DB: adaptive_learning_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learning_user -d adaptive_learning_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: adaptive_learning_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.8.2
    container_name: adaptive_learning_qdrant
    restart: always
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  ollama:
    image: ollama/ollama:latest
    container_name: adaptive_learning_ollama
    restart: always
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  backend:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
    container_name: adaptive_learning_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      - APP_NAME=Adaptive AI Learning Platform
      - APP_ENV=development
      - DEBUG=True
      - DATABASE_URL=postgresql+asyncpg://learning_user:learning_secure_password@postgres:5432/adaptive_learning_db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - OLLAMA_BASE_URL=http://ollama:11434
    ports:
      - "8000:8000"
    volumes:
      - ../backend:/app/backend
      - ../backend/uploads:/app/backend/uploads

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
